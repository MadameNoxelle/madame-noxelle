<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Madame Noxelle | Official</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0c080c;color:#eee;font-family:Arial,Helvetica,sans-serif}
#site{width:100%;height:100dvh;min-height:100vh}#site iframe{display:block;width:100%;height:100%;border:0}
#age-gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 25%,#25141f 0,#10090f 45%,#070508 100%)}
.gate-box{width:min(100%,480px);text-align:center;padding:50px 34px;border:1px solid rgba(195,155,101,.4);background:rgba(18,11,17,.95);box-shadow:0 30px 90px #000a}
.brand{color:#caa16b;font-family:Georgia,'Times New Roman',serif;font-size:clamp(30px,7vw,43px);font-style:italic;letter-spacing:.02em}
.rule{height:1px;width:75px;margin:24px auto;background:#9b754c}.overline{font-size:11px;letter-spacing:.28em;color:#ba9d82;text-transform:uppercase}
h1{font-size:24px;letter-spacing:.04em;font-weight:400;margin:24px 0 14px}p{line-height:1.7;color:#c7bfc7;font-size:14px}
.actions{display:grid;gap:11px;margin-top:30px}button,a.exit{padding:17px 20px;font-size:12px;font-weight:700;letter-spacing:.14em;text-decoration:none;cursor:pointer;text-transform:uppercase}
button{border:1px solid #bd9663;background:#bd9663;color:#140c12}button:hover{background:#d5ad7a}
a.exit{border:1px solid #63535b;background:transparent;color:#c8bdc6}
.small{font-size:11px;opacity:.65;margin-top:20px}
</style>
</head>
<body>
<main id="site"></main>
<section id="age-gate" role="dialog" aria-modal="true" aria-labelledby="age-title">
 <div class="gate-box"><div class="overline">Exclusive Experience</div><div class="brand">Madame Noxelle</div><div class="rule"></div>
 <h1 id="age-title">Nur für Erwachsene ab 18 Jahren</h1>
 <p>Diese Website enthält Inhalte, die ausschließlich für Erwachsene bestimmt sind. Bitte bestätige, dass du mindestens 18 Jahre alt bist.</p>
 <div class="actions"><button type="button" id="confirm-age">Ich bin 18 oder älter – eintreten</button><a class="exit" href="https://www.google.com/">Ich bin unter 18 – verlassen</a></div>
 <p class="small">Mit dem Eintritt bestätigst du deine Volljährigkeit.</p></div>
</section>
<script>
(function(){
 const gate=document.getElementById('age-gate'),site=document.getElementById('site');
 function openSite(){
   if(!site.querySelector('iframe')){
     const frame=document.createElement('iframe');
     frame.title='Madame Noxelle – Startseite';
     frame.src='./site-base.html';
     frame.addEventListener('load',function(){
       try{
         const d=frame.contentDocument;
         const heroUrl=new URL('./5A21EC94-E094-4AFA-8C54-C98607C7DE87.png',location.href).href;
         const aboutUrl=new URL('./ECC9185C-E174-4785-9320-571AF7622641.png',location.href).href;
         function setPhoto(img,url,alt){
           if(!img)return;
           img.removeAttribute('srcset');img.removeAttribute('sizes');
           img.setAttribute('src',url);img.alt=alt;
           img.style.setProperty('object-fit','cover','important');
           img.style.setProperty('object-position','center','important');
           const picture=img.closest('picture');
           if(picture)picture.querySelectorAll('source').forEach(function(x){x.removeAttribute('srcset');x.removeAttribute('sizes');});
         }
         function applyImages(){
           const hero=d.querySelector('.hero-photo');
           if(hero){
             hero.style.setProperty('background-image','url("'+heroUrl+'")','important');
             hero.style.setProperty('background-size','cover','important');
             hero.querySelectorAll('img').forEach(function(i){setPhoto(i,heroUrl,'Neues Startseitenbild');});
           }
           // The previous page has a large portrait below the headline.
           // Replace the actual first prominent image even if its CSS selector differs.
           const candidates=Array.from(d.querySelectorAll('img')).filter(function(img){
             const rect=img.getBoundingClientRect();
             return rect.width>=230 && rect.height>=250 && rect.top<2100 &&
               !img.closest('header,nav,footer') && !img.closest('.hero-photo');
           }).sort(function(x,y){return x.getBoundingClientRect().top-y.getBoundingClientRect().top;});
           if(candidates[0])setPhoto(candidates[0],heroUrl,'Madame Noxelle – neues Startseitenbild');
           const about=d.querySelector('#about img');
           if(about && about!==candidates[0])setPhoto(about,aboutUrl,'Madame Noxelle – neues Porträt');
         }
         applyImages();
         setTimeout(applyImages,400);
         setTimeout(applyImages,1500);
       }catch(e){console.error('Bildanpassung nicht möglich',e);}
     });
     site.appendChild(frame);
   }
   gate.hidden=true;gate.style.display='none';
 }
 // Confirm age explicitly on every new page visit.
 document.getElementById('confirm-age').addEventListener('click',function(){

   openSite();
 });
})();
</script>
</body></html>
